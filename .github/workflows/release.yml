name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # タグ以外の ref で起動された場合は何もしない。
    # workflow_dispatch を main で実行すると "main" というタグが作られる事故を防ぐ。
    # annual-release.yml からは `gh workflow run release.yml --ref "$TAG"` で
    # タグ ref を指定して起動されるため、この条件を満たす。
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            binary: run-on-business-day-linux-amd64
          - os: linux
            arch: arm64
            binary: run-on-business-day-linux-arm64
          - os: windows
            arch: amd64
            binary: run-on-business-day-windows-amd64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 祝日データ (internal/businessday/syukujitsu_data.go) はリポジトリに
      # コミット済みのものをそのまま使う。更新は annual-release.yml が担当する。
      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${{ matrix.binary }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ matrix.binary }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec mv -t release/ {} +
          ls -l release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release/run-on-business-day-linux-amd64 \
            release/run-on-business-day-linux-arm64 \
            release/run-on-business-day-windows-amd64.exe \
            --title "Release $GITHUB_REF_NAME" \
            --notes "Automated build for $GITHUB_REF_NAME"
